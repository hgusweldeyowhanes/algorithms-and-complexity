[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-solver"
version = "0.1.0"
description = "CDCL SAT solver with DIMACS CNF CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sat-solver = "sat_solver.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sat_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
