[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-benchmarker"
version = "0.1.0"
description = "Benchmark algorithms across input sizes and compare to complexity classes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
algo-benchmarker = "algo_benchmarker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["algo_benchmarker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
