[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsp"
version = "0.1.0"
description = "TSP exact (Held-Karp) vs heuristic (nearest neighbor + 2-opt)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tsp = "tsp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tsp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
