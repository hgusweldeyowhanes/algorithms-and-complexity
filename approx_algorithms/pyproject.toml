[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "approx-algorithms"
version = "0.1.0"
description = "Approximation algorithms study: Vertex Cover 2-approx and greedy Set Cover vs OPT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
approx-algorithms = "approx_algorithms.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["approx_algorithms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
