[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "automata"
version = "0.1.0"
description = "DFA, NFA, and Turing machine simulators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
automata = "automata.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["automata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
