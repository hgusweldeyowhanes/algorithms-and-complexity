[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-predictor"
version = "0.1.0"
description = "Predict algorithm CPU time and memory with RF, XGBoost, and neural nets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ml = ["numpy>=1.24", "scikit-learn>=1.3", "xgboost>=2.0"]
system = ["psutil>=5.9"]


[project.scripts]
resource-predictor = "resource_predictor.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["resource_predictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
